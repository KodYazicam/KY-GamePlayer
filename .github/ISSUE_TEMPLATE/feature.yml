name: Feature request
description: A change or addition to KodYazar Client
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or painful today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How should it work? Which tab / module?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Games / Rich Presence
        - Quests
        - Science farm
        - Account / badges / privacy
        - Auth / membership lock
        - Packaging / install
        - Docs
        - Other
