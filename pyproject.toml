[project]
name = "kodyazar-client"
version = "1.3.0"
description = "KodYazar Client — Discord Rich Presence, quest, and game-catalog panel"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.6,<7",
  "cryptography>=42",
  "keyring>=24; sys_platform != 'win32'",
]

[project.scripts]
kodyazar = "ky_gameplayer.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ky_gameplayer*"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]

[tool.coverage.run]
source = ["ky_gameplayer"]
omit = [
  "ky_gameplayer/__main__.py",
  "*/__pycache__/*",
]

[tool.coverage.report]
fail_under = 60
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.coverage.xml]
output = "coverage.xml"
