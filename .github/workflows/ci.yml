name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: unit (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile
        run: python -m compileall -q ky_gameplayer run.py tests
      - name: Unit tests (no Qt)
        run: python -m unittest discover -s tests -v
      - name: Catalog JSON
        run: python -c "import json; data=json.load(open('games.json',encoding='utf-8')); assert isinstance(data,list) and len(data)>0; print(len(data),'games')"

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -U pip ruff
      - run: ruff check .

  ui:
    name: ui smoke (offscreen Qt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3
      - name: Install Qt
        run: python -m pip install -U pip "PySide6>=6.6,<7" "cryptography>=42"
      - name: UI tests
        env:
          QT_QPA_PLATFORM: offscreen
          KODYAZAR_UI_TESTS: "1"
        run: python -m unittest tests.test_ipc tests.test_quest_science tests.test_qt_ui -v

  windows:
    name: windows smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile
        run: python -m compileall -q ky_gameplayer run.py tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
