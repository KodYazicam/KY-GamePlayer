name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile
        run: python -m compileall -q ky_gameplayer run.py tests
      - name: Unit tests (no Qt)
        run: python -m unittest discover -s tests -v
      - name: Catalog JSON
        run: python -c "import json; data=json.load(open('games.json',encoding='utf-8')); assert isinstance(data,list) and len(data)>0; print(len(data),'games')"
